name: Compile and Deploy Touhou 11
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Build Dependencies
        run: |
          cd th11_web
          npm install

      - name: Compile Playable Web Artifacts
        run: |
          cd th11_web
          npm run build

      - name: Upload Compiled Game Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'th11_web/artifacts'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
