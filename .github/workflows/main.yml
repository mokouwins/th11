name: Compile and Deploy Touhou 11
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify static site exists
        run: |
          if [ ! -f th11_web/launcher/public/index.html ]; then
            echo "Expected static site at th11_web/launcher/public/index.html but it was not found."
            ls -la th11_web/launcher
            exit 1
          fi
          echo "Static site found at th11_web/launcher/public"

      - name: Upload Compiled Game Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'th11_web/launcher/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
