name: Compile and Deploy Touhou 11
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PUBLIC_GAME_DATA_URL: 'https://drive.google.com/uc?export=download&id=124_i00KICE-l_YGOFQx8Rmo5Te4zhJ70'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Emscripten SDK
        run: |
          set -eux
          git clone https://github.com/emscripten-core/emsdk.git tools/emsdk
          cd tools/emsdk
          ./emsdk install latest
          ./emsdk activate latest
        shell: bash

      - name: Build release site (install env, download game data, build)
        run: |
          set -eux

          # Prefer the repository secret if present; otherwise fall back to the public URL.
          GAME_DATA_URL='${{ secrets.GAME_DATA_URL }}'
          if [ -z "$GAME_DATA_URL" ]; then
            echo "GAME_DATA_URL secret not set; falling back to PUBLIC_GAME_DATA_URL"
            GAME_DATA_URL="$PUBLIC_GAME_DATA_URL"
          else
            echo "Using GAME_DATA_URL from repository secret"
          fi

          # source emsdk environment for this shell
          source tools/emsdk/emsdk_env.sh || true

          # Download Google Drive file robustly (handles large-file confirmation tokens)
          echo "Downloading game data from: $GAME_DATA_URL"
          TMPDIR=$(mktemp -d)
          FILEID=$(echo "$GAME_DATA_URL" | sed -n 's/.*[?&]id=\([^&]*\).*/\1/p')
          if [ -z "$FILEID" ]; then
            # If URL does not include id=, try to use the full URL directly
            curl -L --fail -o game-data.zip "$GAME_DATA_URL"
          else
            # First fetch to get confirm token if required
            curl -c "$TMPDIR/cookies" -s -L "https://drive.google.com/uc?export=download&id=${FILEID}" > "$TMPDIR/intermezzo.html" || true
            confirm=$(grep -o 'confirm=[0-9A-Za-z_-]\+' "$TMPDIR/intermezzo.html" | sed 's/confirm=//' | head -n1 || true)
            if [ -n "$confirm" ]; then
              echo "Using confirm token: $confirm"
              curl -Lb "$TMPDIR/cookies" -L -o game-data.zip "https://drive.google.com/uc?export=download&confirm=${confirm}&id=${FILEID}"
            else
              curl -Lb "$TMPDIR/cookies" -L -o game-data.zip "https://drive.google.com/uc?export=download&id=${FILEID}"
            fi
          fi

          echo "Download completed. Diagnostic information for game-data.zip:"
          ls -la game-data.zip || true
          # Report file type to see if it's an HTML page or ZIP
          if command -v file >/dev/null 2>&1; then
            file game-data.zip || true
          fi
          echo "First 512 bytes (hex):"
          hexdump -C -n 512 game-data.zip || true
          echo "Strings (first 200 chars) to detect HTML content:"
          strings -n 5 game-data.zip | sed -n '1,40p' || true
          if [ -f "$TMPDIR/intermezzo.html" ]; then
            echo "---- intermezzo.html (first 200 lines) ----"
            sed -n '1,200p' "$TMPDIR/intermezzo.html" || true
            echo "---- end intermezzo.html ----"
          fi

          echo "Extracting game data (this will place files into the repository workspace)..."
          unzip -o game-data.zip -d . || true

          # Verify expected th11.dat location
          EXPECTED_PATH='[th11] 东方地灵殿 (汉化版+日文版)/th11.dat'
          if [ ! -f "$EXPECTED_PATH" ]; then
            echo "Expected game data not found at: $EXPECTED_PATH" >&2
            echo "Listing current directory for debugging:"
            ls -la || true
            ls -la "[th11] 东方地灵殿 (汉化版+日文版)" || true
            exit 1
          fi

          # Run the game build and packaging
          node th11_web/scripts/build-sdl.mjs --release
          node th11_web/scripts/package-release.mjs
        shell: bash

      - name: Verify packaged site exists
        run: |
          if [ ! -f th11_web/artifacts/sdl-release/site/index.html ]; then
            echo "Expected packaged site at th11_web/artifacts/sdl-release/site/index.html but it was not found."
            ls -la th11_web/artifacts || true
            ls -la th11_web/artifacts/sdl-release || true
            exit 1
          fi
          echo "Packaged static site found at th11_web/artifacts/sdl-release/site"

      - name: Upload Compiled Game Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'th11_web/artifacts/sdl-release/site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
