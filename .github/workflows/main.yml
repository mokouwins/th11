name: Compile and Deploy Touhou 11
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Build Dependencies
        run: |
          cd th11_web/launcher
          npm ci

      - name: Compile Playable Web Artifacts
        run: |
          cd th11_web/launcher
          npm run build:launcher

      - name: Prepare Pages artifact
        run: |
          cd th11_web/launcher
          if [ -d dist ]; then SRC=dist
          elif [ -d build ]; then SRC=build
          elif [ -d out ]; then SRC=out
          elif [ -d public ]; then SRC=public
          elif [ -d artifacts ]; then SRC=artifacts
          elif [ -d package ]; then SRC=package
          else
            echo "No build output folder found (checked: dist, build, out, public, artifacts, package)."
            echo "Contents of th11_web/launcher:"
            ls -la
            exit 1
          fi
          echo "Using build source: $SRC"
          rm -rf artifacts
          mkdir -p artifacts
          cp -a "$SRC/." artifacts/

      - name: Upload Compiled Game Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'th11_web/launcher/artifacts'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
